name: Repair PR 442 security contract

on:
  push:
    branches:
      - fix-fail-securely-info-exposure-14413613517653866972
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-pr-442
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix-fail-securely-info-exposure-14413613517653866972
          fetch-depth: 0

      - name: Use preinstalled Temurin JDK 11
        run: |
          echo "JAVA_HOME=$JAVA_HOME_11_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_11_X64/bin" >> "$GITHUB_PATH"

      - name: Apply all-or-nothing directory index policy
        shell: bash
        env:
          OLD_ONE: ICAgIHZhbCBpbmRleF9taWRkbGUgPSBmdW4oKTpTdHJpbmd7IAo=
          NEW_ONE: ICAgIHZhbCBpbmRleF9taWRkbGUgPSBmdW4oKTpTdHJpbmc/eyAK
          OLD_TWO: 
          NEW_TWO: 
          OLD_THREE: ICAgdHJ5IHsKICAgICAgIHdyaXRlX2luZGV4X2ZpbGUoY3Vycl9kaXIsIGluZGV4X3RvcCtpbmRleF9taWRkbGUoKStpbmRleF9ib3R0b20pCg==
          NEW_THREE: 
          TEST_FILE: 
          OLD_RECORD: 
          NEW_RECORD: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          def decoded(name):
              return base64.b64decode(os.environ[name]).decode('utf-8')
          source_path = Path('src/main/kotlin/html4tree/main.kt')
          source = source_path.read_text(encoding='utf-8')
          for old_name, new_name in [('OLD_ONE', 'NEW_ONE'), ('OLD_TWO', 'NEW_TWO'), ('OLD_THREE', 'NEW_THREE')]:
              old = decoded(old_name)
              new = decoded(new_name)
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one {old_name} match, found {count}')
              source = source.replace(old, new, 1)
          source_path.write_text(source, encoding='utf-8')
          Path('src/test/kotlin/html4tree/AttrExceptionTest.kt').write_text(decoded('TEST_FILE'), encoding='utf-8')
          sentinel_path = Path('.jules/sentinel.md')
          sentinel = sentinel_path.read_text(encoding='utf-8')
          old_record = decoded('OLD_RECORD')
          new_record = decoded('NEW_RECORD')
          count = sentinel.count(old_record)
          if count != 1:
              raise SystemExit(f'expected one sentinel record, found {count}')
          sentinel_path.write_text(sentinel.replace(old_record, new_record, 1), encoding='utf-8')
          PY

      - name: Verify Gradle wrapper integrity
        shell: bash
        run: |
          expected_sha256="76b12da7f4a7cdd025e5996811a2e49bf5df0fb62d72554ab555c0e434b63aae"
          actual_sha256="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          test "$actual_sha256" = "$expected_sha256"

      - name: Run the complete build and coverage gate
        run: ./gradlew clean build --no-daemon

      - name: Commit verified repair and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/repair-pr-442.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make unreadable directory indexes all-or-nothing"
          git push origin HEAD:fix-fail-securely-info-exposure-14413613517653866972
