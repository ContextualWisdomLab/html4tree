name: Repair PR 442 directory enumeration contract

on:
  push:
    branches:
      - fix-fail-securely-info-exposure-14413613517653866972
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-pr-442-directory-enumeration
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix-fail-securely-info-exposure-14413613517653866972
          fetch-depth: 0

      - name: Use preinstalled Temurin JDK 11
        run: |
          echo "JAVA_HOME=$JAVA_HOME_11_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_11_X64/bin" >> "$GITHUB_PATH"

      - name: Apply failed-enumeration contract and regression test
        shell: bash
        env:
          OLD_SOURCE: 
          NEW_SOURCE: 
          TEST_FILE: 
          ADR_OLD_ONE: MS4gRGV0ZXJtaW5lIHRoZSBjYW5kaWRhdGUgZW50cmllcyB0aGF0IHdvdWxkIGJlIGNvbnNpZGVyZWQgZm9yIHB1YmxpY2F0aW9uLgoyLiBSZWFkIGFuZCB2YWxpZGF0ZSB0aGUgcmVxdWlyZWQgbWV0YWRhdGEgZm9yIGV2ZXJ5IGNhbmRpZGF0ZS4K
          ADR_NEW_ONE: MS4gRW51bWVyYXRlIHRoZSBjYW5kaWRhdGUgZW50cmllcyB0aGF0IHdvdWxkIGJlIGNvbnNpZGVyZWQgZm9yIHB1YmxpY2F0aW9uOyBpZiBlbnVtZXJhdGlvbiBmYWlscywgYWJvcnQgdGhlIGNvbXBsZXRlIGRpcmVjdG9yeSBpbmRleC4KMi4gUmVhZCBhbmQgdmFsaWRhdGUgdGhlIHJlcXVpcmVkIG1ldGFkYXRhIGZvciBldmVyeSBjYW5kaWRhdGUuCg==
          ADR_OLD_TWO: LSBSZWdyZXNzaW9uIHRlc3RzIG11c3QgaW5jbHVkZSBhIHJlYWRhYmxlIGVudHJ5LCBhbiB1bnZlcmlmaWFibGUgZW50cnksIGFuZCBhIHN0YWxlIGdlbmVyYXRlZCBpbmRleCwgYW5kIG11c3QgcHJvdmUgdGhhdCBubyBwYXJ0aWFsIG9yIHN0YWxlIGluZGV4IHN1cnZpdmVzLgo=
          ADR_NEW_TWO: LSBSZWdyZXNzaW9uIHRlc3RzIG11c3QgY292ZXIgYm90aCBhIGZhaWxlZCBkaXJlY3RvcnkgZW51bWVyYXRpb24gYW5kIGEgcmVhZGFibGUtcGx1cy11bnZlcmlmaWFibGUgY2FuZGlkYXRlIHNldCwgZWFjaCB3aXRoIGEgc3RhbGUgZ2VuZXJhdGVkIGluZGV4LCBhbmQgbXVzdCBwcm92ZSB0aGF0IG5vIGVtcHR5LCBwYXJ0aWFsLCBvciBzdGFsZSBpbmRleCBzdXJ2aXZlcy4K
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          def decoded(name):
              return base64.b64decode(os.environ[name]).decode('utf-8')

          source_path = Path('src/main/kotlin/html4tree/main.kt')
          source = source_path.read_text(encoding='utf-8')
          old_source = decoded('OLD_SOURCE')
          new_source = decoded('NEW_SOURCE')
          if source.count(old_source) != 1:
              raise SystemExit('expected exactly one directory-enumeration source match')
          source_path.write_text(source.replace(old_source, new_source, 1), encoding='utf-8')

          Path('src/test/kotlin/html4tree/DirectoryEnumerationFailureTest.kt').write_text(
              decoded('TEST_FILE'),
              encoding='utf-8'
          )

          adr_path = Path('docs/adr/0001-all-or-nothing-directory-index.md')
          adr = adr_path.read_text(encoding='utf-8')
          for old_name, new_name in [
              ('ADR_OLD_ONE', 'ADR_NEW_ONE'),
              ('ADR_OLD_TWO', 'ADR_NEW_TWO'),
          ]:
              old = decoded(old_name)
              new = decoded(new_name)
              if adr.count(old) != 1:
                  raise SystemExit(f'expected exactly one {old_name} match')
              adr = adr.replace(old, new, 1)
          adr_path.write_text(adr, encoding='utf-8')
          PY

      - name: Verify Gradle wrapper integrity
        shell: bash
        run: |
          expected_sha256="76b12da7f4a7cdd025e5996811a2e49bf5df0fb62d72554ab555c0e434b63aae"
          actual_sha256="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          test "$actual_sha256" = "$expected_sha256"

      - name: Run the complete build and coverage gate
        run: ./gradlew clean build --no-daemon

      - name: Commit verified repair and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/repair-pr-442-directory-enumeration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: fail closed when directory enumeration fails"
          git push origin HEAD:fix-fail-securely-info-exposure-14413613517653866972
