name: Repair owned-index review findings

on:
  push:
    branches:
      - feat/owned-index-preservation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-owned-index-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-owned-index-review:
    if: github.repository == 'ContextualWisdomLab/html4tree' && github.ref == 'refs/heads/feat/owned-index-preservation'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact branch without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=20 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply review fixes idempotently
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def rewrite(path: str, transform):
              file_path = Path(path)
              before = file_path.read_text()
              after = transform(before)
              if after != before:
                  file_path.write_text(after)

          def update_readme(text: str) -> str:
              text = re.sub(
                  r"```\n\$ java -jar (\./build/libs/html4tree\.jar --cleanup --dry-run <top directory to crawl>)\n\$ java -jar (\./build/libs/html4tree\.jar --cleanup <top directory to crawl>)\n```",
                  r"```sh\njava -jar \1\njava -jar \2\n```",
                  text,
                  count=1,
              )
              return text

          def update_main(text: str) -> str:
              if "import com.github.ajalt.clikt.core.UsageError\n" not in text:
                  text = text.replace(
                      "import com.github.ajalt.clikt.core.CliktCommand\n",
                      "import com.github.ajalt.clikt.core.CliktCommand\nimport com.github.ajalt.clikt.core.UsageError\n",
                      1,
                  )
              if "internal fun validate_cleanup_options" not in text:
                  text = text.replace(
                      "    override fun run() {\n        go(topDir, maxLevel, forceOverwrite, cleanup, dryRun)\n    }\n}\n",
                      "    override fun run() {\n        validate_cleanup_options(cleanup, dryRun)\n        go(topDir, maxLevel, forceOverwrite, cleanup, dryRun)\n    }\n}\n\ninternal fun validate_cleanup_options(cleanup: Boolean, dryRun: Boolean) {\n    if (dryRun && !cleanup) {\n        throw UsageError(\"--dry-run requires --cleanup\")\n    }\n}\n",
                      1,
                  )
              replacement = """internal fun read_index_prefix(path: Path, limit: Int = OWNERSHIP_PREFIX_LIMIT): ByteArray? {
    return try {
        if (Files.isSymbolicLink(path)) {
            null
        } else if (limit <= 0) {
            ByteArray(0)
        } else {
            Files.newInputStream(path, LinkOption.NOFOLLOW_LINKS).use { stream ->
                val buffer = ByteArray(limit)
                var offset = 0
                while (offset < limit) {
                    val read = stream.read(buffer, offset, limit - offset)
                    if (read == -1) {
                        break
                    }
                    offset += read
                }
                buffer.copyOf(offset)
            }
        }
    } catch (e: Exception) {
        null
    }
}
"""
              text, count = re.subn(
                  r"internal fun read_index_prefix\(path: Path, limit: Int = OWNERSHIP_PREFIX_LIMIT\): ByteArray\? \{.*?\n\}\n\ninternal fun classify_index_prefix",
                  replacement + "\ninternal fun classify_index_prefix",
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit("expected one read_index_prefix function to rewrite")
              return text

          def update_tests(text: str) -> str:
              if "import com.github.ajalt.clikt.core.UsageError\n" not in text:
                  text = text.replace(
                      "package html4tree\n\n",
                      "package html4tree\n\nimport com.github.ajalt.clikt.core.UsageError\n",
                      1,
                  )
              if "fun dryRunRequiresCleanup()" not in text:
                  text = text.replace(
                      "    @Test\n    fun cleanupDeletesOwnedOnlyAndDryRunSelectsTheSameSet() {\n",
                      "    @Test\n    fun dryRunRequiresCleanup() {\n        assertFailsWith<UsageError> {\n            validate_cleanup_options(cleanup = false, dryRun = true)\n        }\n        validate_cleanup_options(cleanup = false, dryRun = false)\n        validate_cleanup_options(cleanup = true, dryRun = false)\n        validate_cleanup_options(cleanup = true, dryRun = true)\n    }\n\n    @Test\n    fun cleanupDeletesOwnedOnlyAndDryRunSelectsTheSameSet() {\n",
                      1,
                  )
              text = text.replace(
                  "            val failed = cleanup_owned_index(tempDir, dryRun = false, reporter = { reports.add(it) })\n            if (!failed) {\n                assertTrue(reports.any { it.startsWith(\"failed:\") })\n            }\n",
                  "            val cleanupSucceeded = cleanup_owned_index(tempDir, dryRun = false, reporter = { reports.add(it) })\n            if (!cleanupSucceeded) {\n                assertTrue(reports.any { it.startsWith(\"failed:\") })\n            } else {\n                owned.writeText(ownedIndexFixture(\"generated\"))\n            }\n",
                  1,
              )
              if "short-prefix.html" not in text:
                  text = text.replace(
                      "        assertEquals(0, read_index_prefix(owned.toPath(), 0)!!.size)\n        assertEquals(4, read_index_prefix(owned.toPath(), 4)!!.size)\n        assertEquals(null, read_index_prefix(File(tempDir, \"missing-prefix.html\").toPath()))\n",
                      "        assertEquals(0, read_index_prefix(owned.toPath(), 0)!!.size)\n        assertEquals(4, read_index_prefix(owned.toPath(), 4)!!.size)\n        val short = File(tempDir, \"short-prefix.html\")\n        short.writeText(\"abc\")\n        assertEquals(\"abc\", String(read_index_prefix(short.toPath(), 64)!!, Charsets.UTF_8))\n        assertEquals(null, read_index_prefix(File(tempDir, \"missing-prefix.html\").toPath()))\n",
                      1,
                  )
              return text

          rewrite("README.md", update_readme)
          rewrite("src/main/kotlin/html4tree/main.kt", update_main)
          rewrite("src/test/kotlin/html4tree/GeneratedIndexOwnershipTest.kt", update_tests)
          PY

      - name: Verify exact branch
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon

      - name: Commit verified repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-owned-index-review.yml
          git status --short
          git add README.md src/main/kotlin/html4tree/main.kt src/test/kotlin/html4tree/GeneratedIndexOwnershipTest.kt .github/workflows/repair-owned-index-review.yml
          if git diff --cached --quiet; then
            echo "No repair diff produced"
            exit 1
          fi
          git commit -m "fix: address owned index review findings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
