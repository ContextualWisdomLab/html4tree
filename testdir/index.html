<!doctype html>
<html lang="ko">
     <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
        <!-- 보안 향상: 인라인 스크립트 실행 방지 -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'sha256-W3e2o5KyvLtpGCmugl8BOipCH4NU6GZHzRrsFRVKFXc='; base-uri 'none'; form-action 'none';">
        <!-- 보안 향상: 리퍼러를 통한 디렉토리 경로 노출 방지 -->
        <meta name="referrer" content="no-referrer">
        <meta name="robots" content="noindex, nofollow">
        <title>testdir - 디렉토리 목록</title>
        <style>body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.5;
  padding: 1rem;
  color: #1f2328;
}
main {
  max-width: 800px;
  margin: 0 auto;
}
h1 {
  overflow-wrap: anywhere;
}
ul {
  list-style-type: none;
  padding-left: 0;
}
a.dir-link {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  width: 100%;
  overflow-wrap: anywhere;
  box-sizing: border-box;
}
.icon {
  flex-shrink: 0;
  width: 1.25rem;
  text-align: center;
}
a {
  padding: 0.75rem 0.5rem;
  text-decoration: none;
  color: #0969da;
  border-radius: 4px;
  transition: background-color 0.2s ease, outline-color 0.2s ease;
}
a:hover, a:focus-visible {
  background-color: #f6f8fa;
  outline: 2px solid #0969da;
  outline-offset: -2px;
}
a:hover span:last-child, a:focus-visible span:last-child {
  text-decoration: underline;
}
@media (prefers-reduced-motion: reduce) {
  a {
    transition: none;
  }
}
li + li {
  border-top: 1px solid #d0d7de;
}
.empty-dir {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  padding: 0.75rem 0.5rem;
  color: #656d76;
  font-style: italic;
}
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
@media (prefers-color-scheme: dark) {
  body {
    background-color: #0d1117;
    color: #c9d1d9;
  }
  a {
    color: #58a6ff;
  }
  a:hover, a:focus-visible {
    background-color: #161b22;
    outline-color: #58a6ff;
  }
  li + li {
    border-top-color: #21262d;
  }
  .empty-dir {
    color: #8b949e;
  }
}</style>
     </head>
     <body>
       <main>
         <h1>testdir</h1>
         <nav aria-labelledby="nav-heading">
         <h2 id="nav-heading" class="visually-hidden">디렉토리 목록</h2>
         <ul role="list">
            <li><a class="dir-link" href="./.." title="상위 디렉토리로 이동"><span class="icon" aria-hidden="true">&#x21B0;</span> <span aria-hidden="true">..</span> <span class="visually-hidden">상위 디렉토리로 이동</span></a></li>
          <li><a class="dir-link" href="./file1.txt" title="file1.txt 파일"><span class="icon" aria-hidden="true">&#128196;</span> <span>file1.txt</span> <span class="visually-hidden">파일</span></a></li>
          <li><a class="dir-link" href="./subdir1/" title="subdir1 디렉토리"><span class="icon" aria-hidden="true">&#128193;</span> <span>subdir1</span> <span class="visually-hidden">디렉토리</span></a></li>
          <li><a class="dir-link" href="./subdir2/" title="subdir2 디렉토리"><span class="icon" aria-hidden="true">&#128193;</span> <span>subdir2</span> <span class="visually-hidden">디렉토리</span></a></li>

         </ul>
         </nav>
       </main>
    </body>
</html>
